services:
  board-screening:
    build: .
    container_name: board-screening
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/screening.db
      OUTPUT_FILE: /app/data/ths_board_screen_result.csv
      ENABLE_SCHEDULER: "true"
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - screening-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  screening-data:
